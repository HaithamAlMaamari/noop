# Personal build: unsigned iOS IPA for sideloading (Sideloadly / AltStore), built from the `personal`
# branch of this fork. Every push to `personal` builds, runs the package tests, and publishes a normal
# (non-prerelease) GitHub release `v<MARKETING_VERSION>.<run>` with the IPA attached, so the in-app update
# check (pointed at this fork via NOOP_UPDATE_REPO) sees it as the latest release.
#
# Bundle id / App Group are left at upstream's defaults on purpose: the build installs OVER the existing
# com.noopapp.noop app (same sideloader + same Apple ID), so the on-device database and settings survive.
name: Personal iOS build

on:
  push:
    branches: [personal]
    paths-ignore:
      - 'android/**'
      - 'docs/**'
      - '**/*.md'
      - '.github/workflows/personal-sync.yml'
  workflow_dispatch:

concurrency:
  group: personal-ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-26            # iOS 26 SDK (Liquid Glass), same as upstream's release job
    timeout-minutes: 60
    permissions:
      contents: write            # create the release + upload the IPA
    outputs:
      ipa: ${{ steps.pkg.outputs.ipa }}
      tag: ${{ steps.pkg.outputs.tag }}
    steps:
      - uses: actions/checkout@v5

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build NOOPiOS (device, unsigned, Release)
        run: |
          set -o pipefail
          xcodebuild -scheme NOOPiOS -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            NOOP_UPDATE_REPO="${GITHUB_REPOSITORY}" NOOP_PERSONAL_BUILD="${GITHUB_RUN_NUMBER}" \
            build 2>&1 | tee build.log | grep -E " error: |\*\* BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Show compile errors
        if: failure()
        run: |
          grep -nE " error: " build.log | sed -E 's#^[0-9]+:/Users/runner/work/[^/]+/[^/]+/##' | head -60 > errors.txt || true
          [ -s errors.txt ] || tail -40 build.log > errors.txt
          cat errors.txt
          # Annotations (15 lines each) so the errors can be read through the REST API without log access.
          split -l 15 errors.txt err_ || true
          for f in err_*; do
            [ -f "$f" ] && echo "::error title=compile::$(perl -0pe 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g' "$f")"
          done

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7

      - name: Package sideload IPA
        id: pkg
        run: |
          set -euo pipefail
          APP=$(find build/dd/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -type d | head -1)
          test -n "$APP" || { echo ".app not found"; exit 1; }
          rm -rf "$APP/Watch"
          test -d "$APP/PlugIns/NOOPWidgets.appex" || { echo "NOOPWidgets.appex missing"; exit 1; }
          Tools/prepare-ios-sideload-app.sh "$APP"
          VER=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")
          PB=$(/usr/libexec/PlistBuddy -c 'Print :NOOPPersonalBuild' "$APP/Info.plist")
          REPO=$(/usr/libexec/PlistBuddy -c 'Print :NOOPUpdateRepo' "$APP/Info.plist")
          BID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")
          echo "version=$VER personal=$PB repo=$REPO bundle=$BID"
          IPA="NOOP-personal-v${VER}.${PB}.ipa"
          rm -rf Payload && mkdir Payload && cp -R "$APP" Payload/
          zip -qry "$IPA" Payload
          ls -la "$IPA"
          shasum -a 256 "$IPA"
          echo "ipa=$IPA" >> "$GITHUB_OUTPUT"
          echo "tag=v${VER}.${PB}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: noop-ipa
          path: ${{ steps.pkg.outputs.ipa }}
          retention-days: 30

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.pkg.outputs.tag }}
          IPA: ${{ steps.pkg.outputs.ipa }}
        run: |
          set -euo pipefail
          NOTES=$(printf 'Personal build %s from `%s` (%s).\n\nUnsigned. Install with Sideloadly using the same Apple ID as before; it upgrades the existing NOOP in place.\n' \
            "$TAG" "${GITHUB_SHA:0:7}" "$(git log -1 --format=%s)")
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes 2>/dev/null || true
          gh release create "$TAG" "$IPA" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "NOOP personal ${TAG#v}" --notes "$NOTES" --latest

  packages:
    # The pure Swift packages the personal changes touch. Informational: the IPA is published either way,
    # but a red test here is read before the build is installed.
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        package: [StrandAnalytics, StrandImport, WhoopStore, WhoopProtocol]
    steps:
      - uses: actions/checkout@v5
      - name: Test ${{ matrix.package }}
        working-directory: Packages/${{ matrix.package }}
        run: |
          set -o pipefail
          swift test 2>&1 | tee test.log | grep -E "error:|failed|Executed|passed after|Test Suite 'All tests'" | tail -60
      - name: Failures
        if: failure()
        working-directory: Packages/${{ matrix.package }}
        run: |
          grep -E "error:|failed" test.log | grep -v "passed" | sed -E 's#^/Users/runner/work/[^/]+/[^/]+/##' | head -60 > fails.txt || true
          [ -s fails.txt ] || tail -40 test.log > fails.txt
          cat fails.txt
          split -l 15 fails.txt f_ || true
          for f in f_*; do
            [ -f "$f" ] && echo "::error title=${{ matrix.package }}::$(perl -0pe 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g' "$f")"
          done
